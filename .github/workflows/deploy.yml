name: Build and deploy frontend

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Publish static output
        if: ${{ vars.TC_SITE_REPOSITORY != '' }}
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          TC_SITE_REPOSITORY: ${{ vars.TC_SITE_REPOSITORY }}
        run: |
          git clone "https://x-access-token:${SITE_REPO_TOKEN}@github.com/${TC_SITE_REPOSITORY}.git" site
          rm -rf site/*
          cp -r dist/* site/
          cd site
          git config user.email "ci@tonyconsults.co.ke"
          git config user.name "Tony Consults CI"
          git add -A
          git commit -m "Deploy: ${GITHUB_SHA}" || echo "No generated changes"
          git push
